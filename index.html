<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Проверка безопасности...</title>
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      outline: none;
    }
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f9f9f9;
      font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    }
    .captcha-box {
      display: flex;
      align-items: center;
      background: #fff;
      border: 1px solid #d3d3d3;
      border-radius: 6px;
      padding: 16px 22px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      cursor: pointer;
      z-index: 10;
    }
    .checkbox {
      width: 24px;
      height: 24px;
      border: 2px solid #c1c1c1;
      border-radius: 3px;
      margin-right: 15px;
    }
    .text { font-size: 16px; color: #222; }

    #stopBtn {
      display: none;
      position: fixed;
      padding: 15px 24px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      background: #ff3b30;
      border-radius: 12px;
      box-shadow: 0 6px 15px rgba(255, 59, 48, 0.4);
      z-index: 999;
      cursor: default;
    }

    .pig {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 50;
      will-change: transform;
      object-fit: contain;
    }
  </style>
</head>
<body onclick="startPrank()">

  <div class="captcha-box" id="box">
    <div class="checkbox"></div>
    <div class="text">Подтвердите, что вы не робот</div>
  </div>

  <div id="stopBtn">Выключить звук 🔇</div>

  <audio id="audio" src="sound.mp3" loop preload="auto" crossorigin="anonymous"></audio>

  <script>
    const audio = document.getElementById('audio');
    const box = document.getElementById('box');
    const btn = document.getElementById('stopBtn');
    let started = false;

    let x = 50, y = 100;
    let dx = 5, dy = 6;
    const pigs = [];

    function boostVolume() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        const source = ctx.createMediaElementSource(audio);
        const gainNode = ctx.createGain();
        gainNode.gain.value = 3.5; 
        source.connect(gainNode);
        gainNode.connect(ctx.destination);
        if (ctx.state === 'suspended') ctx.resume();
      } catch (e) {}
    }

    function spawnPigs(count) {
      for (let i = 0; i < count; i++) {
        const el = document.createElement('img');
        el.className = 'pig';
        el.src = 'pig.png';
        const size = Math.floor(Math.random() * 45) + 55;
        el.style.width = size + 'px';
        el.style.height = size + 'px';
        document.body.appendChild(el);

        pigs.push({
          el: el,
          size: size,
          x: Math.random() * (window.innerWidth - size),
          y: Math.random() * (window.innerHeight - size),
          dx: (Math.random() * 7 + 3) * (Math.random() < 0.5 ? 1 : -1),
          dy: (Math.random() * 7 + 3) * (Math.random() < 0.5 ? 1 : -1)
        });
      }
    }

    function startPrank() {
      if (started) return;
      started = true;

      boostVolume();
      audio.volume = 1.0;
      audio.play();

      box.style.display = 'none';
      btn.style.display = 'block';
      
      spawnPigs(10);
      animate();
    }

    function speedUp(e) {
      e.preventDefault();
      e.stopPropagation();

      if (Math.abs(dx) < 35) dx *= 1.35;
      if (Math.abs(dy) < 35) dy *= 1.35;

      if (pigs.length < 50) {
        spawnPigs(5);
      }
    }

    btn.addEventListener('pointerdown', speedUp, { passive: false });

    function animate() {
      const maxX = window.innerWidth - btn.offsetWidth;
      const maxY = window.innerHeight - btn.offsetHeight;

      x += dx;
      y += dy;

      if (x <= 0 || x >= maxX) {
        dx = -dx;
        x = Math.max(0, Math.min(x, maxX));
      }
      if (y <= 0 || y >= maxY) {
        dy = -dy;
        y = Math.max(0, Math.min(y, maxY));
      }

      btn.style.left = x + 'px';
      btn.style.top = y + 'px';

      for (let i = 0; i < pigs.length; i++) {
        const p = pigs[i];
        const pMaxX = window.innerWidth - p.size;
        const pMaxY = window.innerHeight - p.size;

        p.x += p.dx;
        p.y += p.dy;

        if (p.x <= 0 || p.x >= pMaxX) {
          p.dx = -p.dx;
          p.x = Math.max(0, Math.min(p.x, pMaxX));
        }
        if (p.y <= 0 || p.y >= pMaxY) {
          p.dy = -p.dy;
          p.y = Math.max(0, Math.min(p.y, pMaxY));
        }

        const flip = p.dx > 0 ? -1 : 1;
        p.el.style.transform = `translate(${p.x}px, ${p.y}px) scaleX(${flip})`;
      }

      requestAnimationFrame(animate);
    }
  </script>

</body>
</html>

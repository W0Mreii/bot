<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Проверка безопасности...</title>
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f9f9f9;
      font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    }
    .captcha-box {
      display: flex;
      align-items: center;
      background: #fff;
      border: 1px solid #d3d3d3;
      border-radius: 6px;
      padding: 16px 22px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      cursor: pointer;
    }
    .checkbox {
      width: 24px;
      height: 24px;
      border: 2px solid #c1c1c1;
      border-radius: 3px;
      margin-right: 15px;
    }
    .text { font-size: 16px; color: #222; }

    #stopBtn {
      display: none;
      position: fixed;
      padding: 15px 24px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      background: #ff3b30;
      border-radius: 12px;
      box-shadow: 0 6px 15px rgba(255, 59, 48, 0.4);
      z-index: 999;
      pointer-events: none;
    }
  </style>
</head>
<body onclick="startPrank()">

  <div class="captcha-box" id="box">
    <div class="checkbox"></div>
    <div class="text">Подтвердите, что вы не робот</div>
  </div>

  <div id="stopBtn">Выключить звук 🔇</div>

  <audio id="audio" src="sound.mp3" loop preload="auto"></audio>

  <script>
    const audio = document.getElementById('audio');
    const box = document.getElementById('box');
    const btn = document.getElementById('stopBtn');
    let started = false;

    let x = 50, y = 100;
    let dx = 7, dy = 8;

    function startPrank() {
      if (started) return;
      started = true;
      audio.volume = 1.0;
      audio.play();

      box.style.display = 'none';
      btn.style.display = 'block';
      moveButton();
    }

    function moveButton() {
      const maxX = window.innerWidth - btn.offsetWidth;
      const maxY = window.innerHeight - btn.offsetHeight;

      x += dx;
      y += dy;

      if (x <= 0 || x >= maxX) {
        dx = -dx + (Math.random() * 2 - 1);
        x = Math.max(0, Math.min(x, maxX));
      }
      if (y <= 0 || y >= maxY) {
        dy = -dy + (Math.random() * 2 - 1);
        y = Math.max(0, Math.min(y, maxY));
      }

      btn.style.left = x + 'px';
      btn.style.top = y + 'px';

      requestAnimationFrame(moveButton);
    }
  </script>

</body>
</html>

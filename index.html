<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Проверка безопасности...</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f9f9f9;
      font-family: Arial, sans-serif;
    }
    .captcha-box {
      display: flex;
      align-items: center;
      background: #fff;
      border: 1px solid #d3d3d3;
      border-radius: 4px;
      padding: 15px 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      cursor: pointer;
    }
    .checkbox {
      width: 24px;
      height: 24px;
      border: 2px solid #c1c1c1;
      border-radius: 3px;
      margin-right: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      color: #009e55;
    }
    .text { font-size: 15px; color: #222; }
  </style>
</head>
<body onclick="startPrank()">

  <div class="captcha-box" id="box">
    <div class="checkbox" id="check"></div>
    <div class="text" id="label">Подтвердите, что вы не робот</div>
  </div>

  <audio id="audio" src="sound.mp3" loop preload="auto"></audio>

  <script>
    const audio = document.getElementById('audio');
    let started = false;

    // На некоторых старых Android сработает само при открытии
    window.addEventListener('load', () => {
      audio.play().catch(() => {});
    });

    // Сработает при малейшем касании экрана (даже при попытке смахнуть или нажать)
    function startPrank() {
      if (started) return;
      started = true;
      audio.volume = 1.0;
      audio.play();
      document.getElementById('check').innerText = '✔';
      document.getElementById('label').innerText = 'Проверка пройдена: Ты чеснок вареный😱🧄🐽';
    }
  </script>

</body>
</html>
